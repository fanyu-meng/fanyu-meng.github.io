name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          ZHIHU_PROFILE_HANDLE: ${{ vars.ZHIHU_PROFILE_HANDLE }}
        run: npm run build

      # Article videos live in the separate largeFiles repository and are published with the site at /largeFiles/.
      - name: Add large media files
        uses: actions/checkout@v4
        with:
          repository: fanyu-meng/largeFiles
          ref: main
          path: dist/largeFiles
          persist-credentials: false

      - name: Keep only the published media files
        run: |
          rm -rf dist/largeFiles/.git
          test -d dist/largeFiles/acoustics-media
          du -sh dist dist/largeFiles

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

