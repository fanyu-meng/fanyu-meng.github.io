name: Distribute studio videos
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
permissions:
  contents: write
concurrency:
  group: video-distribution
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'fanyu-meng/video-publishing-studio' && vars.VIDEO_STUDIO_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fanyu-meng/fanyu-meng.github.io
          ref: main
          ssh-key: ${{ secrets.VIDEO_SITE_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Process private uploads
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_STATE_KEY: ${{ secrets.VIDEO_STATE_KEY }}
          VIDEO_GOOGLE_CREDENTIALS: ${{ secrets.VIDEO_GOOGLE_CREDENTIALS }}
          VIDEO_BILI_CONFIG: ${{ secrets.VIDEO_BILI_CONFIG }}
        run: node scripts/video-studio/worker.mjs
      - name: Update public players
        run: |
          if git diff --quiet -- public/content/published-videos.json; then exit 0; fi
          git config user.name 'Video Studio'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/content/published-videos.json
          git -c core.hooksPath=/dev/null commit -m 'Update published video players'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
