    <!-- GitHub Pages SPA routing support -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // A first visit to the Chinese home page from a browser without Chinese opens the English site.
      // A language picked with the EN / 中文 switch is remembered; crawlers always get the page they asked for.
      (function(l, n) {
        var saved = null;
        try { saved = localStorage.getItem('language'); } catch (e) {}
        var languages = n.languages && n.languages.length ? n.languages : [n.language || ''];
        var chinese = languages.some(function(x) { return /^zh\b/i.test(x); });
        if (l.pathname === '/' && !saved && !chinese && !/bot|crawl|spider|slurp|preview/i.test(n.userAgent)) {
          window.history.replaceState(null, '', '/en/' + l.search + l.hash);
        }
      }(window.location, window.navigator));
    </script>
